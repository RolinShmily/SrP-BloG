name: Friend Link Issue Processor

on:
  issues:
    types: [opened, labeled]

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'friend-link')
    permissions:
      issues: write
    steps:
      - name: Post friend link submission guide
        uses: actions/github-script@v7
        with:
          # 仅发指引评论，全程 GITHUB_TOKEN，无 PAT 依赖
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = [
              '📮 友链申请已收到！感谢你的申请。',
              '',
              '本 Issue 仅作为申请登记（自动打上 `friend-link` 标签）。',
              '请按以下步骤**直接提交 JSON 文件**，提交 PR 后机器人会自动打标签并校验：',
              '',
              '1. Fork 本仓库',
              '2. 在 `src/data/frlinks/` 目录新增一个 JSON 文件（文件名随意，建议用站点名），内容格式如下：',
              '',
              '```json',
              '{',
              '  "name": "站点名称",',
              '  "url": "https://example.com/",',
              '  "description": "一句话描述你的网站",',
              '  "avatar": "https://example.com/favicon.png",',
              '  "backlink": "https://example.com/friends/"',
              '}',
              '```',
              '',
              '3. 提交 Pull Request（标题格式不限，机器人会自动改写）',
              '',
              '提交后机器人自动完成：格式校验 → URL 可达性检查 → 双向链接验证，',
              '全部通过后由站长人工合并，合并即上线。',
              '',
              '> 注意：`backlink` 页面必须包含本站的绝对链接 `https://blog.srprolin.top/`，否则双向验证不通过。'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
