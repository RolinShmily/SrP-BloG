name: Friend Link Issue Processor

on:
  issues:
    types: [opened, labeled]

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'friend-link')
    permissions:
      issues: write
    steps:
      - name: Post friend link submission guide
        uses: actions/github-script@v7
        with:
          # 仅发指引评论，全程 GITHUB_TOKEN，无 PAT 依赖
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            // 去重：opened 与 labeled 事件可能同时触发，避免重复评论
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            if (existing.data.some((c) => c.body && c.body.includes('📮 友链申请已收到'))) {
              console.log('guide comment already exists, skip');
              return;
            }

            const body = [
              '📮 友链申请已收到！感谢你的申请。',
              '',
              '本 Issue 仅作为申请登记（自动打上 `friend-link` 标签）。',
              '请按以下步骤在 `content/friends/` 目录下**新增一个 JSON 文件**，提交 PR 后机器人会自动打标签并校验：',
              '',
              '1. Fork 本仓库',
              '2. 在 `content/friends/` 目录下**新增一个 JSON 文件**（文件名建议用你的站点名，例如 `Example_Blog.json`；文件名不要包含 `/ \\ : * ? " < > |`），文件内容为**单个对象**（不是数组）：',
              '',
              '```json',
              '{',
              '  "name": "站点名",',
              '  "url": "https://example.com",',
              '  "description": "一句话简介",',
              '  "avatar": "https://example.com/avatar.png"',
              '}',
              '```',
              '',
              '3. 提交 Pull Request（标题格式不限，机器人会自动改写）',
              '',
              '4. 可选：在文件中追加 `"backlink": "https://example.com/friends/"`（你网站放置本站链接的页面 URL），机器人会自动做双向链接验证；未填写时机器人会在 PR 中引导补充。',
              '',
              '提交后机器人自动完成：格式校验 → URL 可达性检查 → 双向链接验证，',
              '全部通过后由站长人工合并，合并即上线。',
              '',
              '> 双向链接要求：`backlink` 页面必须包含本站的绝对链接 `https://blog.srprolin.top/`，否则双向验证不通过。'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
