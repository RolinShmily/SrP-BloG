name: Friend Link Issue Processor

on:
  issues:
    types: [opened, edited]

jobs:
  process-friend-link:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'friend-link')
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Parse Issue and Create PR
        uses: actions/github-script@v7
        env:
          PAT: ${{ secrets.PAT }}
        with:
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body;
            
            // 解析 Issue 内容
            const sections = body.split('###');
            const data = {};
            for (const section of sections) {
              if (!section.trim()) continue;
              const lines = section.trim().split('\n');
              const header = lines[0].trim();
              const content = lines.slice(1).join('\n').trim();
              
              if (header.includes('站点名称')) data.name = content;
              if (header.includes('站点链接')) data.url = content;
              if (header.includes('站点描述')) data.description = content;
              if (header.includes('站点头像')) data.avatar = content;
              if (header.includes('回链地址')) data.backlink = content;
            }
            
            if (!data.name || !data.url || !data.avatar) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "❌ 友链申请解析失败：缺少必要信息（名称、链接、头像）。请检查你的 Issue 内容是否完整并重新编辑。"
              });
              return;
            }
            
            // 创建 JSON 文件内容
            const frlinkObj = {
              name: data.name,
              url: data.url,
              description: data.description || "",
              avatar: data.avatar,
              backlink: data.backlink || ""
            };
            
            const safeName = data.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '');
            const filePath = `src/data/frlinks/${safeName}.json`;
            const fileContent = JSON.stringify(frlinkObj, null, 2);
            const encodedContent = Buffer.from(fileContent).toString('base64');
            
            // 验证链接是否存活（简单的 fetch）
            try {
              const urlResponse = await fetch(data.url);
              if (!urlResponse.ok) {
                 await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: `⚠️ 友链申请警告：无法访问你的站点链接 \`${data.url}\` (状态码: ${urlResponse.status})。请确保链接可访问，我们将进行人工审核。`
                 });
              }
            } catch (error) {
               console.log("Fetch failed", error);
            }

            const branchName = `friend-link-${issue.number}`;
            
            // 检查分支是否已存在
            let branchExists = false;
            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              branchExists = true;
            } catch (e) {
              branchExists = false;
            }
            
            if (!branchExists) {
              // 创建分支
              const mainBranch = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main'
              });
              
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: mainBranch.data.object.sha
              });
            }

            // 提交文件
            let sha = undefined;
            try {
              const existingFile = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                ref: branchName
              });
              sha = existingFile.data.sha;
            } catch (e) {}

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `Add friend link: ${data.name} (#${issue.number})`,
              content: encodedContent,
              branch: branchName,
              sha: sha
            });

            // 寻找现有的 PR
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open'
            });

            let prNumber;
            if (pulls.data.length > 0) {
              prNumber = pulls.data[0].number;
            } else {
              // 创建 PR
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `✨ 新友链申请: ${data.name}`,
                body: `Closes #${issue.number}\n\n自动生成的友链 PR，请管理员审核。`,
                head: branchName,
                base: 'main'
              });
              prNumber = pr.data.number;
            }

            // 评论通知用户
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🎉 友链申请已成功解析！系统已自动创建了 Pull Request: #${prNumber} 。请等待管理员审核合并，合并后即可在网站上看到你的链接！`
            });
