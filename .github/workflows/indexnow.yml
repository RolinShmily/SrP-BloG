name: IndexNow Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Produces out/sitemap.xml (Next.js `app/sitemap.ts`), which is the URL
      # source for the submission below.
      - name: Build static export
        run: pnpm build

      # Reads every <loc> from out/sitemap.xml, diffs it against
      # .last-urls.json and submits the new URLs to IndexNow.
      - name: Submit to IndexNow
        run: node scripts/indexnow-submit.js

      - name: Commit URL record
        run: |
          if git diff --quiet -- .last-urls.json; then
            echo "No .last-urls.json changes, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-urls.json
          git commit -m "chore: update IndexNow URL record"
          git pull --rebase --autostash origin main
          git push origin main
