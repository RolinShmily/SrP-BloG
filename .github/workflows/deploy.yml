name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must stay compatible with the checked-in pnpm-lock.yaml (lockfileVersion 9.0).
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # `--ignore-scripts` blocks dependency lifecycle scripts (supply-chain hygiene).
      # The build chain (next/esbuild/sharp-free) ships prebuilt platform binaries as
      # optionalDependencies, so no postinstall step is required.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Verify content
        run: pnpm run verify-content

      # `pnpm build` runs:
      #   1. tsx scripts/sync-post-assets.ts      (content/posts/** -> public/posts/**)
      #   2. tsx scripts/generate-search-index.ts (-> public/search-index.json)
      #   3. next build                           (output: 'export' -> out/)
      - name: Build static export
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=srp-blog --branch=main
