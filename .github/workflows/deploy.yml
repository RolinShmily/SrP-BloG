name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must stay compatible with the checked-in pnpm-lock.yaml (lockfileVersion 9.0).
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # `--ignore-scripts` blocks dependency lifecycle scripts (supply-chain hygiene).
      # The build chain (next/esbuild/sharp-free) ships prebuilt platform binaries as
      # optionalDependencies, so no postinstall step is required.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      # Card-cover pipeline: mirrors `content/posts/**` into `public/posts/**` and
      # compresses each image into a 768px WebP card thumbnail (`<name>.thumb.webp`,
      # ~95% smaller) with sharp. Opt out with `cardThumbnail: false` in
      # src/config/site.ts — that skips sharp entirely and cards use the original
      # covers, which is what you want if no pipeline step can generate thumbnails.
      #
      # Runs before `Verify content` so the thumbnails this step reports are the
      # ones the verification then asserts against, rather than the other way round.
      - name: Generate card thumbnails (sharp)
        run: pnpm run sync-assets

      - name: Verify content
        run: pnpm run verify-content

      # `pnpm build` runs:
      #   1. tsx scripts/sync-post-assets.ts      (content/posts/** -> public/posts/**, no-op after the step above)
      #   2. tsx scripts/generate-search-index.ts (-> public/search-index.json)
      #   3. next build                           (output: 'export' -> out/)
      - name: Build static export
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
