name: 友链申请
description: 提交一个新的友情链接
title: "[友链申请] <你的站点名称>"
labels: ["friend-link"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎申请友链！请填妥以下信息。

        - 提交后会自动打上 `friend-link` 标签（申请登记），机器人会回复提交指引：
          需要在 `content/friends/` 目录下新增一个 JSON 文件（文件名建议用站点名）并提交 Pull Request。
        - 机器人会对 PR 自动打标签、校验 URL 可达性与双向链接，最终由站长人工合并。

        参考格式（`content/friends/<站点名>.json`，单个文件只写一个对象，不是数组）：

        ```json
        { "name": "站点名", "url": "https://example.com", "description": "一句话简介", "avatar": "https://example.com/avatar.png" }
        ```

  - type: input
    id: sitename
    attributes:
      label: 站点名称 (name)
      description: 你的网站名称
      placeholder: 例如：SrP-BloG
    validations:
      required: true

  - type: input
    id: siteurl
    attributes:
      label: 站点链接 (url)
      description: 你的网站首页链接 (需以 http:// 或 https:// 开头)
      placeholder: 例如：https://blog.srprolin.top/
    validations:
      required: true

  - type: input
    id: sitedesc
    attributes:
      label: 站点描述 (description)
      description: 用一两句话描述你的网站
      placeholder: 例如：如无必要，勿增实体。
    validations:
      required: true

  - type: input
    id: siteavatar
    attributes:
      label: 站点头像 (avatar)
      description: 你的网站图标链接 (需以 http:// 或 https:// 开头)
      placeholder: 例如：https://blog.srprolin.top/favicon/favicon.ico
    validations:
      required: true

  - type: input
    id: sitebacklink
    attributes:
      label: 回链地址 (backlink)
      description: 你网站上放置了本站链接的页面地址 (用于自动双向链接验证，可选；填写后需包含 https://blog.srprolin.top/)
      placeholder: 例如：https://example.com/friends/
    validations:
      required: true
