name: 友链申请 (中文)
description: 申请交换友情链接
title: "[友链申请] <站点名称>"
labels: ["friend-link", "lang:zh"]
body:
  - type: markdown
    attributes:
      value: |
        ### 欢迎申请友链

        请在下方填写你的站点信息，提交后我们会尽快审核处理。

        > **须知**:
        > 1. 请确保站点支持 HTTPS 且能稳定访问。
        > 2. 申请前请先在贵站添加本站友链（回链）。

  - type: input
    id: sitename
    attributes:
      label: 站点名称
      description: 你的网站或博客名称
      placeholder: 例如：SrP-BloG
    validations:
      required: true

  - type: input
    id: siteurl
    attributes:
      label: 站点链接
      description: 你的网站首页链接 (需以 http:// 或 https:// 开头)
      placeholder: 例如：https://blog.srprolin.top/
    validations:
      required: true

  - type: input
    id: sitedesc
    attributes:
      label: 站点描述
      description: 用一两句话描述你的网站
      placeholder: 例如：如无必要，勿增实体。
    validations:
      required: true

  - type: input
    id: siteavatar
    attributes:
      label: 站点头像
      description: 你的网站图标或头像链接 (需以 http:// 或 https:// 开头)
      placeholder: 例如：https://blog.srprolin.top/favicon/favicon.ico
    validations:
      required: true

  - type: input
    id: sitebacklink
    attributes:
      label: 回链地址
      description: 贵站放置了本站链接的页面地址 (用于双向验证；需包含 https://blog.srprolin.top/)
      placeholder: 例如：https://example.com/friends/
    validations:
      required: true
