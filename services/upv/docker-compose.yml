# VPS deployment for srp-blog-upv.
#
#   export UPV_SALT="$(openssl rand -hex 32)"
#   docker compose up -d --build
#   curl http://127.0.0.1:8787/api/health
#
# Put a reverse proxy (nginx / Caddy / Cloudflare tunnel) in front for TLS and
# rate limiting; the service itself only does best-effort throttling.

services:
  upv:
    build: .
    image: srp-blog-upv:latest
    container_name: srp-blog-upv
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      DB_PATH: /data/upv.sqlite
      # Comma-separated list of allowed blog origins, or "*".
      ALLOWED_ORIGINS: "${UPV_ALLOWED_ORIGINS:-*}"
      # REQUIRED: must be identical across restarts, otherwise visitor identity
      # resets. Provide it via the environment, never bake it into the image.
      SALT: "${UPV_SALT:?UPV_SALT must be set (e.g. export UPV_SALT=$(openssl rand -hex 32))}"
      # 0 = every request counts as a page view; 60000 = 60s per-IP/per-path window.
      THROTTLE_WINDOW_MS: "${UPV_THROTTLE_WINDOW_MS:-0}"
      BLOCK_BOTS: "true"
    volumes:
      - upv-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  upv-data:
