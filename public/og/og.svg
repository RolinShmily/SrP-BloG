<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="pinkGlow" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#f75c7e" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#f75c7e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="88%" cy="82%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#f75c7e" stop-opacity="0.25" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#pinkGlow)" />
  <rect width="1200" height="630" fill="url(#blueGlow)" />

  <!-- Inner Card Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="#18181b" fill-opacity="0.45" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Bar: Monogram + Capsule Brand -->
  <g transform="translate(80, 75)">
    <!-- Brand Monogram (viewBox 0 0 96 48 scaled to 80x40) -->
    <g transform="scale(0.85)">
      <path d="M 23.8 17.5 C 25.2 8.5, 34.8 2.5, 29.0 2.5 C 21.0 2.5, 12.3 8.5, 11.9 17.5 C 11.6 24.5, 25.0 23.0, 24.5 32.5 C 24.0 41.5, 9.0 43.8, 5.8 37.0 C 4.2 33.5, 6.0 29.5, 10.0 28.0"
            fill="none" stroke="#f75c7e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 37.5 41.5 L 41.8 14.0 L 44.5 18.0 C 48.0 14.0, 54.0 14.0, 56.5 23.5"
            fill="none" stroke="#f75c7e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 64.0 42.0 L 68.8 9.5"
            fill="none" stroke="#f75c7e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 60.5 10.5 C 64.0 4.0, 74.0 2.5, 82.5 3.5 C 90.5 4.5, 92.0 12.5, 86.0 20.0 C 81.0 24.0, 74.0 24.0, 68.5 22.5"
            fill="none" stroke="#f75c7e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Capsule label -->
    <g transform="translate(95, 3)">
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="16" y="21" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7" letter-spacing="0.5">RoL1n's BloG</text>
    </g>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(80, 230)">
    <text x="0" y="0" font-family="'Noto Serif SC', 'Noto Sans SC', serif" font-size="64" font-weight="700" fill="#fafafa" letter-spacing="-1">
      SrP-BloG
    </text>
    <text x="320" y="-8" font-family="'Noto Sans SC', sans-serif" font-size="28" font-weight="400" fill="#f75c7e">
      / 技术分享与实践
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="65" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="400" fill="#a1a1aa">
      编程开发 · 服务器运维 · 网络技术 · 容器化部署
    </text>

    <!-- Motto / Bio -->
    <g transform="translate(0, 125)">
      <line x1="0" y1="-5" x2="32" y2="-5" stroke="#f75c7e" stroke-width="2" />
      <text x="44" y="0" font-family="'Noto Serif SC', serif" font-style="italic" font-size="19" fill="#71717a">
        Entities should not be multiplied unnecessarily. — 如无必要，勿增实体。
      </text>
    </g>
  </g>

  <!-- Bottom Metadata Bar -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#27272a" stroke-width="1" />

    <!-- Left: Author -->
    <circle cx="6" cy="30" r="4" fill="#10b981" />
    <text x="20" y="35" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="500" fill="#d4d4d8">
      Author: RoL1n
    </text>

    <!-- Center tags -->
    <text x="230" y="35" font-family="'Noto Sans SC', sans-serif" font-size="15" fill="#71717a">
      Next.js 15 · Tailwind CSS · TypeScript · Static Export
    </text>

    <!-- Right: Domain -->
    <text x="1040" y="35" text-anchor="end" font-family="'Noto Sans SC', monospace" font-size="17" font-weight="600" fill="#f75c7e">
      blog.srprolin.top
    </text>
  </g>
</svg>